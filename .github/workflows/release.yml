name: Release

# Push a tag like v0.2.0 (matching devlog/__init__.py) to build and publish
# daily-devlog to PyPI. Publishing uses PyPI trusted publishing: add this
# repository and workflow (release.yml, environment "pypi") as a trusted
# publisher on pypi.org first; no API token is stored in GitHub.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(python -c "import devlog; print(devlog.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} != devlog.__version__ $version"; exit 1; }
      - name: Build
        run: |
          python -m pip install build twine
          python -m build --outdir dist .
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
