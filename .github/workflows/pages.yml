name: Deploy GitHub Pages

# Publishes the contents of docs/ as the site root for
# https://musicofthings.github.io/devlog/ (so /log/ is correct, not /docs/log/).
# Repo Settings → Pages → Source must be "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "posts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify docs site root
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/.nojekyll
          test -f docs/log/index.html
          echo "Site root files OK:"
          find docs -maxdepth 2 -type f | sort | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
