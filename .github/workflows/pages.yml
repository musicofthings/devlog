name: Deploy GitHub Pages

# Publishes the contents of docs/ as the site root, e.g.
# https://<owner>.github.io/<repo>/ (so /log/ is correct, not /docs/log/).
# Repo Settings → Pages → Source must be "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "posts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify docs site root
        id: verify
        run: |
          set -euo pipefail
          # A new site repo has no log until its first `devlog publish`;
          # skip the deploy instead of failing that first push.
          if [ ! -f docs/log/index.html ]; then
            echo "::notice::No docs/log/ yet - skipping deploy until the first published post."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f docs/index.html
          test -f docs/.nojekyll
          echo "Site root files OK:"
          find docs -maxdepth 2 -type f | sort | head -50
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        if: steps.verify.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        if: steps.verify.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.verify.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
