name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows is where the nightly Task Scheduler job runs; test it there too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,mcp]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Slash commands in sync
        run: python -m devlog.commands_sync --check

      - name: Test
        run: python -m pytest -q

      - name: Audit published posts
        # Fails if a post in posts/ leaks harness text, secrets, or user paths.
        run: python -m devlog audit --repo .

      - name: Package builds and passes twine check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m build --outdir dist .
          python -m twine check --strict dist/*
