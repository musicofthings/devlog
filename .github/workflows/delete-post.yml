name: Delete or hide devlog post

# Triggered from the admin panel on docs/log/index.html via the GitHub API's
# workflow_dispatch endpoint, using a personal token scoped to Actions:
# read/write only. This job's own GITHUB_TOKEN does the actual commit/push,
# so that personal token never needs repo-contents write access.
#
# After a successful push, pages.yml deploys from the push event's commit SHA
# (path filter matches posts/** and docs/**). This workflow intentionally does
# NOT deploy Pages itself — sharing the `pages` concurrency group with
# cancel-in-progress caused racing dual deploys that could cancel each other.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Post date (YYYY-MM-DD)"
        required: true
      action:
        description: "delete | hide | unhide (default: delete)"
        required: false
        default: "delete"

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs
        env:
          MANAGE_DATE: ${{ github.event.inputs.date }}
          MANAGE_ACTION: ${{ github.event.inputs.action || 'delete' }}
        run: |
          set -euo pipefail
          if [[ ! "$MANAGE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date input: $MANAGE_DATE (expected YYYY-MM-DD)"
            exit 1
          fi
          case "$MANAGE_ACTION" in
            delete|hide|unhide) ;;
            *)
              echo "Invalid action input: $MANAGE_ACTION (expected delete|hide|unhide)"
              exit 1
              ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Configure devlog
        run: devlog init --defaults

      - name: Apply action
        env:
          MANAGE_DATE: ${{ github.event.inputs.date }}
          MANAGE_ACTION: ${{ github.event.inputs.action || 'delete' }}
          GIT_AUTHOR_NAME: devlog-bot
          GIT_AUTHOR_EMAIL: devlog-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: devlog-bot
          GIT_COMMITTER_EMAIL: devlog-bot@users.noreply.github.com
        run: |
          set -euo pipefail
          case "$MANAGE_ACTION" in
            delete)  devlog delete --date "$MANAGE_DATE" ;;
            hide)    devlog hide --date "$MANAGE_DATE" ;;
            unhide)  devlog unhide --date "$MANAGE_DATE" ;;
          esac
