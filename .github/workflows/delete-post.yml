name: Delete devlog post

# Triggered from the admin panel on docs/log/index.html via the GitHub API's
# workflow_dispatch endpoint, using a personal token scoped to Actions:
# read/write only. This job's own GITHUB_TOKEN does the actual commit/push,
# so that personal token never needs repo-contents write access.
#
# Deploys Pages itself in this same job (mirroring pages.yml's steps)
# instead of dispatching pages.yml as a separate workflow run: a prior
# version did `gh workflow run pages.yml --ref main` here, but that races
# the just-completed push -- GitHub can resolve `main` to the pre-delete
# commit for a second or two after the push lands, silently redeploying the
# stale site. Redeploying from this job's own already-updated working tree
# makes that race impossible.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Post date to delete (YYYY-MM-DD)"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  delete:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Configure devlog
        run: devlog init --defaults

      - name: Delete post
        run: devlog delete --date "$DELETE_DATE"
        env:
          DELETE_DATE: ${{ github.event.inputs.date }}
          GIT_AUTHOR_NAME: devlog-bot
          GIT_AUTHOR_EMAIL: devlog-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: devlog-bot
          GIT_COMMITTER_EMAIL: devlog-bot@users.noreply.github.com

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
